<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #0f0f0f;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  .chat-container {
    width: 100%;
    max-width: 520px;
    background: #1a1a1a;
    border-radius: 20px;
    border: 1px solid #2a2a2a;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 600px;
  }

  .chat-header {
    padding: 18px 22px;
    background: #111;
    border-bottom: 1px solid #2a2a2a;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .bot-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .header-info h2 {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
  }

  .header-info p {
    font-size: 12px;
    color: #10b981;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .header-info p::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #10b981;
    display: inline-block;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scrollbar-width: thin;
    scrollbar-color: #333 transparent;
  }

  .msg {
    max-width: 80%;
    padding: 11px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.6;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .msg.bot {
    background: #252525;
    color: #e5e5e5;
    border-radius: 4px 16px 16px 16px;
    align-self: flex-start;
    border: 1px solid #2a2a2a;
  }

  .msg.user {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    border-radius: 16px 16px 4px 16px;
    align-self: flex-end;
  }

  .typing {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 14px 18px;
    background: #252525;
    border: 1px solid #2a2a2a;
    border-radius: 4px 16px 16px 16px;
    align-self: flex-start;
    width: fit-content;
  }

  .typing span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #6366f1;
    animation: bounce 1.2s infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  .input-area {
    padding: 16px 20px;
    background: #111;
    border-top: 1px solid #2a2a2a;
    display: flex;
    gap: 10px;
  }

  #userInput {
    flex: 1;
    background: #252525;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 11px 16px;
    color: #fff;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }

  #userInput:focus { border-color: #6366f1; }
  #userInput::placeholder { color: #555; }

  #sendBtn {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s, transform 0.1s;
    flex-shrink: 0;
  }

  #sendBtn:hover { opacity: 0.9; }
  #sendBtn:active { transform: scale(0.95); }

  #sendBtn svg { width: 18px; height: 18px; fill: white; }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="bot-avatar">🤖</div>
    <div class="header-info">
      <h2>AI Assistant</h2>
      <p>Online — ready to help</p>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="msg bot">Hello! 👋 How can I help you today?</div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off" />
    <button id="sendBtn">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
      </svg>
    </button>
  </div>
</div>

<script>
  const messagesDiv = document.getElementById("messages");
  const userInput = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");

  function addMessage(text, sender) {
    const msg = document.createElement("div");
    msg.className = `msg ${sender}`;
    msg.textContent = text;
    messagesDiv.appendChild(msg);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function showTyping() {
    const typing = document.createElement("div");
    typing.className = "typing";
    typing.id = "typing";
    typing.innerHTML = "<span></span><span></span><span></span>";
    messagesDiv.appendChild(typing);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    addMessage(text, "user");
    userInput.value = "";
    sendBtn.disabled = true;
    showTyping();

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });

      const data = await response.json();
      removeTyping();
      addMessage(data.reply || "Sorry, something went wrong.", "bot");
    } catch {
      removeTyping();
      addMessage("Connection error. Please try again.", "bot");
    }

    sendBtn.disabled = false;
    userInput.focus();
  }

  sendBtn.addEventListener("click", sendMessage);
  userInput.addEventListener("keypress", e => {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
